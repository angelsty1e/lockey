# ============================================================================
#  Dependabot — automatisation de la chaîne d'approvisionnement (A03:2025).
#  Maintient les dépendances et les actions de CI à jour, et ouvre des PR de
#  sécurité dès qu'une CVE est publiée.
# ============================================================================
version: 2
updates:
  # Backend (Express/Prisma)
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Regroupe les patchs mineurs pour limiter le bruit de PR.
      server-minor-patch:
        update-types: [minor, patch]

  # Frontend (React/Vite)
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  # Actions GitHub elles-mêmes (intégrité de la CI — A08:2025).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
